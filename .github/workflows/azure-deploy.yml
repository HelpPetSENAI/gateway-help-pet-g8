name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: helppetregistry.azurecr.io
  IMAGE: helpet-gateway
  RESOURCE_GROUP: helpet-rg
  WEB_APP: helpet-gateway

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to ACR
        run: |
          az acr login --name $(echo $REGISTRY | sed 's|.azurecr.io||')
      
      - name: Build and push Docker image
        run: |
          az acr build \
            --registry $(echo $REGISTRY | sed 's|.azurecr.io||') \
            --image ${{ env.IMAGE }}:latest \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --file gateway/Dockerfile \
            .
      
      - name: Deploy to App Service
        run: |
          az webapp config container set \
            --name ${{ env.WEB_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest \
            --docker-registry-server-url https://${{ env.REGISTRY }} \
            --docker-registry-server-user $(az acr credential show -n $(echo $REGISTRY | sed 's|.azurecr.io||') --query "username" -o tsv) \
            --docker-registry-server-password $(az acr credential show -n $(echo $REGISTRY | sed 's|.azurecr.io||') --query "passwords[0].value" -o tsv)
      
      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ env.WEB_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }}
      
      - name: Wait for deployment
        run: sleep 30
      
      - name: Verify deployment
        run: |
          URL="https://${{ env.WEB_APP }}.azurewebsites.net/api/health"
          for i in {1..5}; do
            if curl -f "$URL"; then
              echo "✅ Deployment successful!"
              exit 0
            fi
            echo "Attempt $i/5 - waiting..."
            sleep 10
          done
          echo "❌ Deployment verification failed"
          exit 1
