spring:
  application:
    name: help-pet-gateway

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Redis para Rate Limiting
  # Aiven Redis exige SSL (rediss://). Se usar Azure Cache for Redis, mude REDIS_SSL para false.
  data:
    redis:
      host: ${REDIS_HOST:gateway-help-pet-g8-vhzzlk.i.aivencloud.com}
      port: ${REDIS_PORT:16321}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 60s
        ssl:
          use-insecure-trust-manager: false
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
        - name: Retry
          args:
            retries: 2
            methods: GET
            series: SERVER_ERROR
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
        - AddResponseHeader=X-Gateway-Version, 1.0.0
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=Strict-Transport-Security, max-age=31536000; includeSubDomains
        - AddResponseHeader=Referrer-Policy, strict-origin-when-cross-origin
        - AddResponseHeader=Permissions-Policy, camera=(), microphone=(), geolocation=()
        - AddResponseHeader=Content-Security-Policy, default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com

# Azure App Service: configure WEBSITES_PORT=8080 nas configurações do App Service
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
  http2:
    enabled: true
  shutdown: graceful

# JWT — mesma propriedade lida pelo JwtProvider.java (@Value("${jwt.secret}"))
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# Segurança — token interno e paths públicos
api:
  security:
    public-paths: "/auth/**,/api/v1/auth/**,/actuator/health,/api/health"
    public-post-paths: "/api/v1/users,/api/v1/users/login"
    internal-token: ${INTERNAL_SERVICE_TOKEN}

# CORS — lido por SecurityConfig.java (@Value("${cors.allowed-origins}"))
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Actuator — sem rota gateway exposta em produção
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      exclude: shutdown,env,configprops,gateway
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: false
    shutdown:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:true}

logging:
  level:
    root: WARN
    com.helppet: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
  pattern:
    console: "[%thread] %-5level %logger{36} - %msg%n"

resilience4j:
  circuitbreaker:
    instances:
      g1CircuitBreaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5
      g2CircuitBreaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5
      g3CircuitBreaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5
      g4CircuitBreaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5
      g5CircuitBreaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        minimum-number-of-calls: 5
