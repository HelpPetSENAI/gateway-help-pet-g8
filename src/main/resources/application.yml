spring:
  application:
    name: ${SPRING_APPLICATION_NAME:help-pet-gateway}

  # JPA + H2 para métricas
  datasource:
    url: jdbc:h2:mem:helpet-gateway;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  h2:
    console:
      enabled: false

  # Redis (Rate Limiting)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # Spring Cloud Gateway - roteamento declarativo nativo
  cloud:
    gateway:
      # Timeout global para todos os servicos downstream
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

      # Filtros globais aplicados em TODAS as rotas
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
        - name: Retry
          args:
            retries: 2
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
            methods: GET
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
        - AddResponseHeader=X-Gateway-Version, 1.0.0
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY

      routes:
        # =======================================================
        # PORTA 8081: G1 - Cadastro + Login + Perfis + Localização
        # =======================================================
        - id: g1-auth-users
          uri: ${G1_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**, /api/v1/profiles/**, /api/v1/roles/**, /api/v1/user-locations/**
          filters:
            - name: CircuitBreaker
              args:
                name: g1CircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8082: G2 - Pet CRUD + Upload + Histórico Doação
        # =======================================================
        - id: g2-pets
          uri: ${G2_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/pets/**, /api/v1/pet-uploads/**, /api/v1/donation-history/**
          filters:
            - name: CircuitBreaker
              args:
                name: g2CircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8083: G3 - Solicitação de Adoção
        # =======================================================
        - id: g3-adoption
          uri: ${G3_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/adoptions/**, /api/v1/adoption-approvals/**
          filters:
            - name: CircuitBreaker
              args:
                name: g3CircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8084: G4 - Conversas + Histórico + Orientação
        # =======================================================
        - id: g4-chat
          uri: ${G4_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/conversations/**, /api/v1/messages/**, /api/v1/chat/**
          filters:
            - name: CircuitBreaker
              args:
                name: g4CircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8085: G5 - Notificações
        # =======================================================
        - id: g5-notifications
          uri: ${G5_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**, /api/v1/alerts/**
          filters:
            - name: CircuitBreaker
              args:
                name: g5CircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable
        #   predicates:
        #     - Path=/api/v1/future2/**

server:
  port: ${SERVER_PORT:8080}

# =======================================================
# Controle de Rotas Publicas (Modo Profissional sem Hardcode)
# =======================================================
api:
  security:
    public-paths:
      - "/auth/**"
      - "/api/v1/auth/**"
      - "/actuator/health"
      - "/api/health"
    public-post-paths:
      - "/api/v1/users"
      - "/api/v1/users/login"

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Logging
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.helppet: ${LOG_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# Actuator / Health Checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  info:
    env:
      enabled: true

# Health agregado do Gateway
health:
  monitor:
    g1-auth-users: ${HEALTH_MONITOR_G1:true}
    g2-pets: ${HEALTH_MONITOR_G2:true}
    g3-adoption: ${HEALTH_MONITOR_G3:true}
    g4-chat: ${HEALTH_MONITOR_G4:true}
    g5-notifications: ${HEALTH_MONITOR_G5:true}

info:
  app:
    name: HelpPet API Gateway
    version: 1.0.0
    description: API Gateway centralizado para os microservicos HelpPet
