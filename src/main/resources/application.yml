spring:
  application:
    name: ${SPRING_APPLICATION_NAME:help-pet-gateway}

  # Redis (Rate Limiting)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # Spring Cloud Gateway - roteamento declarativo nativo
  cloud:
    gateway:
      # Timeout global para todos os servicos downstream
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

      # Filtros globais aplicados em TODAS as rotas
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
        - name: Retry
          args:
            retries: 2
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
            methods: GET
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
        - AddResponseHeader=X-Gateway-Version, 1.0.0
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY

      routes:
        # =======================================================
        # PORTA 8081: Identidade e Seguranca (Users / Auth)
        # =======================================================
        - id: identity-security
          uri: ${IDENTITY_SECURITY_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: identityCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8082: Gestao Completa de Pets
        # =======================================================
        - id: pet-management
          uri: ${PET_MANAGEMENT_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/pets/**
          filters:
            - name: CircuitBreaker
              args:
                name: petCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8083: Encontrar Pets (Achados e Perdidos)
        # =======================================================
        - id: lost-found-pets
          uri: ${LOST_FOUND_PETS_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/lost-pets/**, /api/v1/found-pets/**
          filters:
            - name: CircuitBreaker
              args:
                name: lostFoundCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8084: Localizacao e Distancia
        # =======================================================
        - id: location-distance
          uri: ${LOCATION_DISTANCE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/locations/**, /api/v1/distances/**
          filters:
            - name: CircuitBreaker
              args:
                name: locationCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8085: Processo de Adocao
        # =======================================================
        - id: adoption-process
          uri: ${ADOPTION_PROCESS_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/adoptions/**
          filters:
            - name: CircuitBreaker
              args:
                name: adoptionCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8086: Comunicacao (Chat / Mensagens)
        # =======================================================
        - id: communication-chat
          uri: ${COMMUNICATION_CHAT_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/chats/**, /api/v1/messages/**
          filters:
            - name: CircuitBreaker
              args:
                name: chatCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8087: Alertas do Sistema (Notificacoes)
        # =======================================================
        - id: system-alerts
          uri: ${SYSTEM_ALERTS_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/notifications/**, /api/v1/alerts/**
          filters:
            - name: CircuitBreaker
              args:
                name: alertsCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        # =======================================================
        # PORTA 8088: Reservado (Futuro Microsservico)
        # =======================================================
        # - id: future-service-1
        #   uri: ${FUTURE_SERVICE_1_URL:http://localhost:8088}
        #   predicates:
        #     - Path=/api/v1/future1/**

        # =======================================================
        # PORTA 8089: Reservado (Futuro Microsservico)
        # =======================================================
        # - id: future-service-2
        #   uri: ${FUTURE_SERVICE_2_URL:http://localhost:8089}
        #   predicates:
        #     - Path=/api/v1/future2/**

server:
  port: ${SERVER_PORT:8080}

# =======================================================
# Controle de Rotas Publicas (Modo Profissional sem Hardcode)
# =======================================================
api:
  security:
    public-paths:
      - "/auth/**"
      - "/api/v1/auth/**"
      - "/actuator/health"
      - "/api/health"
    public-post-paths:
      - "/api/v1/users"
      - "/api/v1/users/login"

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Logging
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.helppet: ${LOG_LEVEL_APP:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# Actuator / Health Checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  info:
    env:
      enabled: true

# Health agregado do Gateway (servicos futuros ficam desabilitados por padrao)
health:
  monitor:
    identity-security: ${HEALTH_MONITOR_IDENTITY_SECURITY:true}
    pet-management: ${HEALTH_MONITOR_PET_MANAGEMENT:true}
    lost-found: ${HEALTH_MONITOR_LOST_FOUND:false}
    location-distance: ${HEALTH_MONITOR_LOCATION_DISTANCE:false}
    adoption-process: ${HEALTH_MONITOR_ADOPTION_PROCESS:false}
    communication-chat: ${HEALTH_MONITOR_COMMUNICATION_CHAT:false}
    system-alerts: ${HEALTH_MONITOR_SYSTEM_ALERTS:false}

info:
  app:
    name: HelpPet API Gateway
    version: 1.0.0
    description: API Gateway centralizado para os microservicos HelpPet
