spring:
  application:
    name: ${SPRING_APPLICATION_NAME:help-pet-gateway}

  # Redis (Rate Limiting)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # Spring Cloud Gateway - roteamento declarativo nativo
  cloud:
    gateway:
      # Timeout global para todos os servicos downstream
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

      # Filtros globais aplicados em TODAS as rotas
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
        - name: Retry
          args:
            retries: 2
            statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
            methods: GET
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
        - AddResponseHeader=X-Gateway-Version, 1.0.0
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY

      routes:
        # -------------------------------------------------------
        # HelpPet Service - Pets
        # -------------------------------------------------------
        - id: helppet-pets
          uri: ${HELPPET_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/pets/**

        # -------------------------------------------------------
        # HelpPet Service - Users
        # -------------------------------------------------------
        - id: helppet-users
          uri: ${HELPPET_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**

        # -------------------------------------------------------
        # Slots para futuros microservicos (adicione abaixo)
        # Exemplo:
        # - id: notification-service
        #   uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
        #   predicates:
        #     - Path=/api/v1/notifications/**
        # -------------------------------------------------------

server:
  port: ${SERVER_PORT:8080}

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Logging
logging:
  level:
    root: INFO
    com.helppet: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# Actuator / Health Checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    gateway:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    redis:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: HelpPet API Gateway
    version: 1.0.0
    description: API Gateway centralizado para os microservicos HelpPet
